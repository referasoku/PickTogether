<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!--Font Awesome for fun lil Icons-->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <!-- Supabase Client Library-->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="./script.js"></script>
        <link rel="stylesheet" href="./style.css">
        <title>PickTogether</title>
    </head>
    <body>
        <header>
        <!-- Top Navigation Bar -->
        <nav class="navbar">
            <div class="nav-left">
                <div id="room-key-display" class="room-key-badge"style="display: none;">
                    <i class="fa-solid fa-key"></i> Room Key: <span id="key-value">------</span>
                    <button class="btn btn-secondary" style="padding: 2px 6px; font-size: 0.75rem; margin-left: 5px;" onclick="copyInviteLink()">Copy Link</button>
                </div>
                <a href="#" class="navbar-brand" onclick="event.preventDefault(); goHome();">
                    <i class="fa-solid fa-people-group"></i> PickTogether
                </a>
            </div>
            <ul class="nav-links">
                <li class="nav-item">
                    <a href="#" class="nav-link" onclick="event.preventDefault(); goHome();"><i class="fa-solid fa-house"></i> Home</a>
                </li>
                <li class="nav-item" id="dropdown-rooms">
                    <button class="nav-link dropdown-toggle" onclick="toggleDropdown('dropdown-rooms')">
                        <i class="fa-solid fa-user-group"></i> Rooms <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <ul class="dropdown-menu">
                        <li><a href="#" class="dropdown-item" onclick="event.preventDefault(); createRoom();"><i class="fa-solid fa-plus"></i> Create Room</a></li>
                        <li><a href="#" class="dropdown-item" onclick="event.preventDefault(); promptJoinRoom();"><i class="fa-solid fa-right-to-bracket"></i> Join Room</a></li>
                    </ul>
                </li>
            </ul>
        </nav>
        </header>
                <!-- Custom Generic Modal Dialog HTML -->
        <div id="custom-modal" class="modal-overlay">
            <div class="modal-box">
                <h3 id="modal-title">Prompt Title</h3>
                <p id="modal-desc">Please enter the required information:</p>
                <input type="text" id="modal-input" placeholder="Type here...">
                <div class="modal-buttons">
                    <button class="btn btn-secondary" id="modal-cancel-btn" onclick="closeModal(false)">Cancel</button>
                    <button class="btn btn-primary" id="modal-submit-btn" onclick="closeModal(true)">Submit</button>
                </div>
            </div>
        </div>
        <main class="main-container">
                      <!-- VIEW 1: Home / Landing Screen -->
            <section id="home-view" class="view-section active">
                <div class="hero-card">
                    <h1>Make Group Decisions Together</h1>
                    <p>Create a room to manage multiple polls, vote, and decide in real time.</p>
                    <div class="hero-actions">
                        <button class="btn btn-primary" onclick="createRoom()"><i class="fa-solid fa-plus-circle"></i> Create Room</button>
                        <button class="btn btn-secondary" onclick="promptJoinRoom()"><i class="fa-solid fa-right-to-bracket"></i> Join Room</button>
                    </div>
                </div>
            </section>
            <!-- VIEW 2: Active Room Screen -->
            <section id="room-view" class="view-section">
                <div class="room-grid">
                    <!-- Left Column: Members & Kick Feature -->
                    <div class="card">
                        <h3><i class="fa-solid fa-users"></i> Members</h3>
                        <table class="user-table">
                            <thead>
                                <tr><th>User</th><th>Role</th><th>Action</th></tr>
                            </thead>
                            <tbody id="user-table-body"></tbody>
                        </table>
                    </div>
                      <!-- Right Column: Poll Tabs & Voting Area -->
                    <div class="room-content-area">
                        <!-- Poll Tabs -->
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div id="poll-tabs-container" class="poll-tabs"></div>
                            <button id="add-poll-btn" class="btn btn-primary host-only" style="display:none; margin-bottom: 1.5rem;" onclick="promptCreatePoll()">+ New Poll</button>
                        </div>
                        <!-- Active Poll Card -->
                        <div class="card" id="active-poll-card">
                            <h3 id="poll-title-heading">Loading Poll... <span id="poll-status-badge" class="badge open">Open</span></h3>
                            <!-- Host Settings for Current Poll -->
                            <div id="poll-settings-box" class="host-only" style="display:none; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px; margin-bottom: 15px;">
                                <div style="display: flex; gap: 10px; margin-bottom: 8px;">
                                    <div class="setting-group" style="flex:1;">
                                        <label>Result Visibility:</label>
                                        <select id="result-visibility-select" onchange="updatePollSettings()">
                                            <option value="live">Show Live Results</option>
                                            <option value="hidden">Hide Until Closed</option>
                                        </select>
                                    </div>
                                    <div class="setting-group" style="flex:1;">
                                        <label>Deadline Timer:</label>
                                        <input type="time" id="poll-deadline-input" onchange="updatePollSettings()">
                                    </div>
                                </div>
                                <button class="btn btn-danger" style="font-size: 0.85rem;" onclick="closeCurrentPoll()"><i class="fa-solid fa-lock"></i> Close Voting</button>
                            </div>
                            <!-- Add Option (Participants & Host) -->
                            <div class="add-option-box">
                                <input type="text" id="new-option-input" placeholder="Suggest a choice...">
                                <button class="btn btn-primary" onclick="addOption()">Add Option</button>
                            </div>
                            
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
